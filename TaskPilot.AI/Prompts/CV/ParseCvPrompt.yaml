name: ParseCv
description: Extract structured information from a CV
template_format: semantic-kernel

execution_settings:
  default:
    temperature: 0
    max_tokens: 2500

input_variables:
  - name: cvText
    description: Plain text extracted from the uploaded CV.

template: |
  You are an expert technical recruiter.

  Analyze the CV below and return ONLY valid JSON.

  Extract:

  - Job Title
  - Seniority Level
  - Total Years Of Experience
  - Technical Skills
  - Skill Level
  - Years of experience for each skill
  - Confidence score (0 to 1)

  Rules:

  - Extract EVERY SINGLE technical skill, programming language, framework, database, tool, architecture pattern, and cloud platform mentioned in the CV.
  - The CV text may have formatting issues where words are merged together without spaces (e.g. "SQLFrameworks" means "SQL" and "Frameworks" are two separate items). Carefully split such merged words based on known technology names.
  - Extract skills from ALL sections of the CV, not only the most clearly formatted ones — especially check any section literally titled "Skills" and its subcategories.
  - Be exhaustive: do not stop after finding a partial list, continue scanning the entire text.
  - Return ONLY technical skills. Ignore soft skills.
  - Treat "SQL" (as a query language) and "SQL Server" (as a database product) as two
  SEPARATE skills if both are mentioned, even if one implies the other. Do not merge them
  into a single entry.
  - Never wrap JSON inside markdown.
  - Never return code fences.
  - Return ONLY valid JSON.
  - After identifying all skills, determine which ONE skill best represents the employee's primary expertise.
  - Choose exactly ONE skill.
  - Usually the skill with highest experience, strongest confidence, and most related to JobTitle.
  - Exactly one skill must have isPrimarySuggested set to true, all others must be false.

  SeniorityLevel must be one of:

  - Junior
  - MidLevel
  - Senior
  - Lead

  Skill level must be one of:

  - Beginner
  - Intermediate
  - Advanced
  - Expert

  Output schema:

  {
    "jobTitle": "",
    "seniorityLevel": "",
    "totalYearsOfExperience": 0,
    "skills":
    [
      {
        "name":"",
        "level":"",
        "yearsOfExperience":0,
        "confidenceScore":0.0,
        "isPrimarySuggested":false
      }
    ]
  }

  CV

  {{$cvText}}
