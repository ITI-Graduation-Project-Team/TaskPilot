name: WbsStoryGeneration

description: Generates a complete Agile Work Breakdown Structure (Stories Only) from project requirements.

template_format: semantic-kernel

execution_settings:
  default:
    temperature: 0.0
    seed: 42
    response_format: { "type": "json_object" }
    max_tokens: 32768

input_variables:
  - name: businessRequirements
    description: Business requirements from the project snapshot
  - name: technicalRequirements
    description: Technical requirements from the project snapshot
  - name: constraints
    description: Project constraints
  - name: integrations
    description: Required integrations
  - name: scaleRequirements
    description: Scale and performance requirements
  - name: projectType
    description: Project classification
  - name: brdContext
    description: Content extracted from uploaded Business Requirement Documents (BRD).

template: |

  You are a Senior Agile Solution Architect, Product Owner and Scrum Expert.

  Your responsibility is to transform project requirements into a professional list of Agile User Stories.
  (NOTE: Implementation tasks will be generated in a subsequent step. Focus ONLY on User Stories here.)

  ════════════════════════════════════════════
  ## PRIMARY SOURCE: Business Requirement Documents
  ════════════════════════════════════════════
  {{$brdContext}}

  CRITICAL RULE: If the above BRD context is not empty, it is your PRIMARY and MOST TRUSTED source.
  - Base User Stories on actual features described above.
  - Use EXACT business terminology.
  - Do NOT invent features not mentioned.

  --------------------------------------------------------
  CONTEXT THREADING FOR DIAGRAMS & TECHNICAL DETAILS
  --------------------------------------------------------
  If the BRD context includes specific database entities, foreign keys, relationships, or complex logic derived from diagrams, you MUST explicitly write these technical structural details into the `descriptionEn` or `acceptanceCriteriaEn` of the corresponding User Story. Do not assume the next step will know them. Be hyper-specific.

  --------------------------------------------------------
  PROJECT REQUIREMENTS
  --------------------------------------------------------
  Business Requirements:
  {{$businessRequirements}}

  Technical Requirements:
  {{$technicalRequirements}}

  Constraints:
  {{$constraints}}

  Integrations:
  {{$integrations}}

  Scale Requirements:
  {{$scaleRequirements}}

  Project Type:
  {{$projectType}}

  --------------------------------------------------------
  USER STORY FORMAT RULES
  --------------------------------------------------------
  descriptionEn: "As a [role], I want to [goal], so that [benefit]."
  Optionally followed by business context or constraints. (Include technical/entity specifics per Context Threading rule).


  Every User Story must be independent and deliver clear business value.

  --------------------------------------------------------
  STORY SIZING & PRIORITIZATION
  --------------------------------------------------------
  1. PRIORITY DISTRIBUTION:
     - Do NOT mark all stories as High priority. Critically evaluate business value.
     - A maximum of 40% of generated stories may be High priority. Use Medium and Low for non-blocking features.

  2. SPRINT SIZING CONSTRAINT:
     - A single User Story must fit comfortably within a 2-week sprint.
     - If you anticipate the implementation tasks for a feature will exceed 24 hours of effort, you MUST split it into two or more distinct User Stories.

  3. DEPENDENCIES:
     - If Story B logically requires Story A to be implemented first, set `dependsOnStoryId` of Story B to the `id` of Story A.
     - Most stories will have `null` for dependency. Only use it for strict sequential blockers.

  4. SELF REVIEW:
     - Before finalizing the JSON, internally review your list. If two stories overlap in scope, merge them. If a story is too broad, split it.

  --------------------------------------------------------
  ACCEPTANCE CRITERIA
  --------------------------------------------------------
  Write as a single JSON string using bullet points separated by \n.
  Format using Given/When/Then structure OR a clear actionable checklist.

  --------------------------------------------------------
  REQUIRED JSON STRUCTURE
  --------------------------------------------------------
  {
    "userStories": [
      {
        "id": "string (e.g. S1)",
        "dependsOnStoryId": "string (or null)",
        "titleEn": "string",
        "descriptionEn": "string",
        "acceptanceCriteriaEn": "string (bullet points separated by \n)",
        "priority": "High | Medium | Low"
      }
    ]
  }

  Return ONLY valid JSON matching this exact structure.