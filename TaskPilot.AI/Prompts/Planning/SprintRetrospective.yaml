name: SprintRetrospective
description: Analyzes sprint outcomes and developer comments to generate a retrospective report.
template_format: semantic-kernel
template: |
  Analyze the sprint performance data and developer comments provided below.
  Generate an enterprise-grade professional sprint retrospective report in BOTH English and Arabic.
  
  Ensure complete coverage of all completed tasks, delayed tasks, and developer comments.
  Do not omit any valid information or insights due to length constraints.
  Maximize business value and provide highly actionable, trace-driven improvements.
  
  Sprint Goal:
  {{$sprintGoal}}
  
  Completed Tasks (Title, Estimated Hours, Actual Hours):
  {{$completedTasksJson}}
  
  Delayed/Incomplete Tasks (Title, Status, Estimated Hours):
  {{$delayedTasksJson}}
  
  Developer Comments (representing obstacles, blockers, sentiment):
  {{$commentsJson}}
  
  Return ONLY a valid JSON object matching this structure:
  {
    "whatWentWellEn": "...",
    "whatWentWellAr": "...",
    "challengesEn": "...",
    "challengesAr": "...",
    "actionItemsEn": "...",
    "actionItemsAr": "...",
    "teamSentimentSummaryEn": "...",
    "teamSentimentSummaryAr": "..."
  }
input_variables:
  - name: sprintGoal
    description: The goal of the sprint.
  - name: completedTasksJson
    description: JSON string of completed tasks.
  - name: delayedTasksJson
    description: JSON string of incomplete tasks.
  - name: commentsJson
    description: JSON string of developer discussion comments.
