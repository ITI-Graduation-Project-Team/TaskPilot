name: WbsGeneration
description: Generates a Work Breakdown Structure from project requirements
template_format: semantic-kernel
execution_settings:
  default:
    temperature: 0.3
    max_tokens: 4000
input_variables:
  - name: businessRequirements
    description: Business requirements from the project snapshot
  - name: technicalRequirements
    description: Technical requirements from the project snapshot
  - name: constraints
    description: Project constraints
  - name: integrations
    description: Required integrations
  - name: scaleRequirements
    description: Scale and performance requirements
template: |
  You are an expert Agile project planner.

  Your task is to analyze the following project requirements and generate
  a complete Work Breakdown Structure (WBS) as a flat list of User Stories,
  each containing Tasks.

  ## Requirements

  ### Business Requirements
  {{$businessRequirements}}

  ### Technical Requirements
  {{$technicalRequirements}}

  ### Constraints
  {{$constraints}}

  ### Integrations
  {{$integrations}}

  ### Scale Requirements
  {{$scaleRequirements}}

  ## Language Detection Rule
  Detect the primary language of the requirements above.
  - If primarily Arabic → write Arabic content first, English as translation
  - If primarily English → write English content first, Arabic as translation
  - BOTH language fields must always be fully populated — never leave
    TitleAr, DescriptionAr, or AcceptanceCriteriaAr empty or as
    placeholder text. Write complete, natural Arabic sentences — do NOT
    mix English words into Arabic fields.

  ## Output Rules
  - Generate between 5 and 15 UserStories depending on project scope.
  - Each UserStory must have between 2 and 6 Tasks.
  - Every Task EffortSize must be exactly one of: Small, Medium, Large
  - Every Task Type must be exactly one of: Technical, NonTechnical
  - Every Task Priority must be exactly one of: Low, Medium, High
  - Every UserStory Priority must be exactly one of: Low, Medium, High
  - EstimatedHours must be consistent with EffortSize:
      Small  = 1 to 4 hours
      Medium = 4 to 16 hours
      Large  = 16 to 40 hours
  - AcceptanceCriteria should be written as numbered lines in a single
    string (e.g. "1. Criteria one\n2. Criteria two") — not as a JSON array.
  - Do NOT group UserStories into Sprints — Sprint assignment happens later.
  - Return ONLY valid JSON. No markdown, no code fences, no explanation
    text before or after the JSON.

  ## Required JSON Structure
  {
    "userStories": [
      {
        "titleEn": "string",
        "titleAr": "string",
        "descriptionEn": "string",
        "descriptionAr": "string",
        "acceptanceCriteriaEn": "string",
        "acceptanceCriteriaAr": "string",
        "priority": "High | Medium | Low",
        "tasks": [
          {
            "titleEn": "string",
            "titleAr": "string",
            "descriptionEn": "string",
            "descriptionAr": "string",
            "acceptanceCriteriaEn": "string",
            "acceptanceCriteriaAr": "string",
            "effortSize": "Small | Medium | Large",
            "type": "Technical | NonTechnical",
            "estimatedHours": number,
            "priority": "High | Medium | Low"
          }
        ]
      }
    ]
  }
