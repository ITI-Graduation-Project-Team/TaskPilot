  --------------------------------------------------------
  FINAL SELF VALIDATION
  --------------------------------------------------------

  Before producing the final answer, internally verify ALL of the following:

  ## Anti-Pattern Checks

  □ COHESION CHECK: Every payment gateway, webhook, and external service integration
    task has its callback/listener handler in the SAME task, not a separate one.

  □ ENTITY CHECK: No task title's PRIMARY purpose is "Design Entity", "Create Schema",
    "Add Migration", or "Register in DbContext". If found, merge into parent API task.

  □ LAYER CHECK: Every User Story with both Angular and ASP.NET Core work (or mobile
    work) has them as SEPARATE tasks. No task title mixes multiple technology layers.

  □ HOUR CAP CHECK: No task has EstimatedHours above 16. Any task at 20, 24, 28, or
    30 hours is a generation error — split it before submitting.

  □ ALIGNMENT CHECK: Every task's estimatedHours falls within its effortSize range:
    Small → 1–4h, Medium → 5–12h, Large → 13–16h.
    Any mismatch (e.g., effortSize "Small" with estimatedHours 10) must be corrected.

  □ DIVERSITY CHECK: No task list replicates old-style atomized patterns ("Design
    Search Filters", "Optimize SQL Query" as separate tasks). COHESION RULE applied.

  □ TASK TYPE CHECK: Every task has type "Technical" or "NonTechnical". NonTechnical
    only used for tasks that produce no code or infrastructure artifact.

  □ TESTING TASK CHECK: Every testing task meets the TESTING TASK RULES threshold
    (complex logic, financial, integration, or data-critical story). No testing tasks
    on simple CRUD stories.

  □ INTEGRATION COVERAGE CHECK: Every integration in {{$integrations}} has at least
    one corresponding task in the output. No required integration is missing.

  □ NFR COVERAGE CHECK: Every non-functional requirement in scaleRequirements is
    represented — either as an AC condition on a User Story or as a dedicated
    Technical User Story. None are silently dropped.

  ## User Story Quality Checks

  □ USER STORY FORMAT CHECK: Every descriptionEn starts with "As a [role]," and every
    descriptionAr starts with "بوصفي [role]،". No description omits the role, goal,
    or benefit. No description contains implementation details.

  □ TITLE VERB CHECK: Every User Story title and every task title starts with an
    action verb. Any title starting with a noun or adjective must be rewritten.

  □ PRIORITY ALIGNMENT CHECK: No task in a High-priority story has Low priority.
    No task in a Low-priority story has High priority without a cross-story
    dependency reason. All misalignments are fixed.

  □ Every User Story represents ONE user goal.
  □ No User Story represents an entire module.
  □ Large business capabilities have been split into multiple User Stories.
  □ Every User Story delivers clear business value.
  □ Every User Story is independently implementable.
  □ Tasks are implementation work rather than business features.
  □ Tasks are diverse and specific to the User Story.
  □ The confirmed Tech Stack has been used whenever appropriate.

  ## Schema and Format Checks

  □ Every bilingual field is populated.
  □ ACCEPTANCE CRITERIA STRING CHECK: Every acceptanceCriteriaEn and acceptanceCriteriaAr
    is a single string with \n separators — never an array, never multiple string values.
  □ Priorities are valid (High | Medium | Low).
  □ EffortSize values are valid (Small | Medium | Large).
  □ Type values are valid (Technical | NonTechnical).
  □ EstimatedHours are realistic integers.
  □ The JSON exactly matches the required schema.
  □ Entire JSON is valid — no trailing commas, every array closed, every object closed.

  Only after every validation succeeds, output the final JSON object.

