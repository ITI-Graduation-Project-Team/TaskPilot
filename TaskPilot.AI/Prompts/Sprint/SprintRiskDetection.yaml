name: SprintRiskDetection
description: Detects risks in an active sprint based on context snapshot
template_format: semantic-kernel

execution_settings:
  default:
    temperature: 0
    max_tokens: 2500

input_variables:
  - name: sprintContext
    description: Serialized JSON of SprintRiskContext

template: |
  You are an expert Scrum Risk Analyst.
  
  Analyze the following Sprint Context JSON and identify any sprint risks. 
  Return ONLY valid JSON.
  
  Rules:
  - Flag `VelocityDeviation` if `ActualHours / EstimatedHours > 1.5` AND status is still `InProgress`.
  - Flag `CapacityOverload` if `ScheduledHoursToday > 9` for an employee with `InProgress` tasks.
  - Flag `DependencyBlocker` if a task is blocked AND other `InProgress` tasks depend on its completion.
  - Flag `SkillGap` if a task's required skill is not covered by any team member at the required level.
  - Flag `ContextSwitching` if a single `Employee` has more than 3 tasks in the `InProgress` status simultaneously.
  - Severity rules: Critical if sprint completion is directly threatened; High if a specific task will be delayed; Medium if it's a warning.
  - RiskType must match: VelocityDeviation, CapacityOverload, DependencyBlocker, SkillGap, UnfinishedTask, BurnoutRisk, ContextSwitching
  - Severity must match: Medium, High, Critical
  - Never wrap JSON inside markdown.
  - Never return code fences.
  - Return ONLY valid JSON.
  
  Output schema:
  {
    "risks": [
      {
        "riskType": "",
        "severity": "",
        "affectedTaskId": null,
        "affectedEmployeeId": null,
        "messageEn": "",
        "messageAr": ""
      }
    ]
  }

  Sprint Context:
  {{$sprintContext}}
