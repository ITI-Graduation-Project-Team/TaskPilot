name: SprintBurnoutAnalysis
description: Calculates burnout scores based on sprint context
template_format: semantic-kernel

execution_settings:
  default:
    temperature: 0
    max_tokens: 1000

input_variables:
  - name: employeeSprintContext
    description: JSON containing workload, pace, and engagement signals.

template: |
  You are an expert Agile Coach.
  Calculate the Burnout Risk for this employee in the current sprint.
  
  Rules for calculating scores (ALL SCORES MUST BE INTEGERS BETWEEN 0 AND 100):
  1. WorkloadScore: (AssignedHours / MaxSprintCapacity) * 100. Cap at 100.
  2. PaceScore: 100 if ActualHours > AssignedHours OR TasksOverdue > 0. 50 if ActualHours == AssignedHours. 0 otherwise.
  3. EngagementScore: 100 if CommentsMade == 0 AND StatusUpdates == 0 (meaning LOW engagement = HIGH burnout risk). 0 if they are engaged.
  4. BurnoutScore: Calculate exactly -> (WorkloadScore * 0.5) + (PaceScore * 0.3) + (EngagementScore * 0.2). Round to nearest integer.
  5. RiskLevel: "High" if BurnoutScore >= 70, "AtRisk" if BurnoutScore is between 40 and 69, "Healthy" if BurnoutScore < 40.
  
  Return ONLY valid JSON.
  {
    "burnoutScore": 0,
    "workloadScore": 0,
    "paceScore": 0,
    "engagementScore": 0,
    "riskLevel": "",
    "trendDirection": "stable"
  }
  
  Context:
  {{$employeeSprintContext}}
