name: SprintBurnoutAnalysis
description: Calculates burnout scores based on sprint context
template_format: semantic-kernel

execution_settings:
  default:
    temperature: 0
    max_tokens: 1000

input_variables:
  - name: employeeSprintContext
    description: JSON containing workload, pace, and engagement signals.

template: |
  You are an expert Agile Coach.
  Calculate the Burnout Risk for this employee in the current sprint.
  
  Rules:
  - WorkloadScore: (AssignedHours / MaxSprintCapacity) * 100, capped at 100
  - PaceScore: High (e.g. 80-100) if ActualHours >> EstimatedHours or Tasks are Overdue. Low otherwise.
  - EngagementScore: Low if no comments or status updates in days. High otherwise.
  - BurnoutScore: Weighted average (50% Workload, 30% Pace, 20% Engagement).
  - RiskLevel: "High" if BurnoutScore >= 70, "AtRisk" if BurnoutScore is between 40 and 69, "Healthy" if BurnoutScore < 40.
  
  Return ONLY valid JSON.
  {
    "burnoutScore": 0,
    "workloadScore": 0,
    "paceScore": 0,
    "engagementScore": 0,
    "riskLevel": "",
    "trendDirection": "stable"
  }
  
  Context:
  {{$employeeSprintContext}}
